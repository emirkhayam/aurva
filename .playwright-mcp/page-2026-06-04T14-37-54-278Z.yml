        - generic [ref=e37]:
          - heading "Избран новый состав Наблюдательного Совета АУРВА" [level=2] [ref=e38]
          - text: Решением Ассоциации утвержден обновленный состав Наблюдательного совета АУРВА. В него вошли представители финансового, инвестиционного и цифрового рынков, обладающие значительным управленческим и регуляторным опытом.
          - strong [ref=e39]: "Повторно избраны:"
          - text: "-"
          - strong [ref=e40]: Максим Уваров
          - text: "-"
          - strong [ref=e41]: Акмарал Тулегенова
          - strong [ref=e42]: "Новые члены НС:"
          - text: "-"
          - strong [ref=e43]: Эстебес Нарынбаев
          - text: "-"
          - strong [ref=e44]: Арстанбек Абдикапаров
          - text: "-"
          - strong [ref=e45]: Адилет Мамыров
          - strong [ref=e46]: Информация о членах Наблюдательного совета
          - strong [ref=e47]: Адилет Мамыров
          - text: Корпоративный юрист и управленец с более чем 15-летним опытом в договорной работе, закупках, проектном управлении и корпоративном сопровождении. Соучредитель Bithub, где курирует правовые вопросы, регуляторное соответствие и управление рисками в сфере цифровых активов. Также является соучредителем и корпоративным юристом AptoCMS, сопровождая договорные процессы и вопросы комплаенса. Более 8 лет работал в Beeline Kyrgyzstan, включая руководящие позиции в направлениях закупок, договорного управления и мобильных финансовых сервисов.
          - strong [ref=e48]: Акмарал Тулегенова
          - text: Заместитель Председателя и сооснователь АУРВА, финансовый аналитик и управленец с опытом в стратегическом управлении и IT-сфере. Активно участвовала в выработке стратегических решений Ассоциации, формировании предложений по регулированию рынка виртуальных активов и выстраивании диалога с участниками отрасли. С 2022 года развивает блокчейн-направление, объединяя профессиональное сообщество и реализуя образовательные, экспертные и отраслевые инициативы, направленные на устойчивое развитие рынка.
          - strong [ref=e49]: Эстебес Нарынбаев
          - text: Специалист в области законодательства о виртуальных активах и регулирования цифровых финансовых инструментов. Обладает практическим опытом взаимодействия с государственными органами Кыргызской Республики по вопросам разработки и внесения изменений в нормативные правовые акты, регулирующие деятельность участников рынка виртуальных активов. Является участником государственных и государственно-частных рабочих групп, экспертных и консультационных площадок, направленных на совершенствование законодательства и формирование прозрачной и устойчивой регуляторной среды.
          - strong [ref=e50]: Максим Уваров
          - text: Профессионал с более чем 20-летним опытом работы в финансовой сфере. Работал в ведущих банковских учреждениях Латвии, занимал позиции дилера, брокера, доверительного управляющего и руководителя брокерского отдела. Является соучредителем брокерской компании в Словакии. Магистр социальных наук в области экономики (University of Latvia), специалист по регулированию финансовых рынков и противодействию отмыванию средств (MiFID II). С 2022 года работает на финансовом рынке Кыргызстана.
          - strong [ref=e51]: Арстанбек Абдикапаров
          - text: Эксперт в сфере финансовых рынков и цифровых активов с более чем 10-летним опытом в инвестиционной деятельности. Основатель инвестиционного холдинга Royal и лицензированной криптовалютной компании Royal Pure Gold. Имеет опыт управления международными проектами в сфере инвестиций, платежных решений и цифровых активов. Ранее работал в государственном органе регулирования финансового рынка, где участвовал в разработке и совершенствовании законодательства в сфере производных, ипотечных и исламских ценных бумаг, способствуя развитию нормативной базы финансового рынка Кыргызской Республики. Обновлённый состав Наблюдательного совета продолжит работу по стратегическому развитию Ассоциации, укреплению институциональной устойчивости и формированию прозрачной, конкурентоспособной среды для рынка виртуальных активов в Кыргызской Республике. 24.02.2026
