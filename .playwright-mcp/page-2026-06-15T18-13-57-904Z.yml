      - text: Ассоциация выразила готовность к открытому диалогу и сотрудничеству с ГНС для формирования сбалансированного и прозрачного регулирования индустрии. В результате обсуждения принято решение о дальнейшем совместном взаимодействии для выработки эффективных решений в сфере учета и налогообложения виртуальных активов.
      - text: Мы уверены, что такое партнерство между государственными органами и профессиональным сообществом станет основой для устойчивого развития криптоиндустрии в стране.
