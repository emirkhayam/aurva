      - strong [ref=e26]: Новый председатель АУРВА – Темир Казыбай
      - text: С 4 марта 2025 года Ассоциация участников рынка виртуальных активов работает под руководством нового председателя – Темира Казыбая. Его кандидатура была единогласно поддержана резидентами ассоциации.
      - text: Темир Казыбай – высококвалифицированный юрист и эксперт в области цифрового права, корпоративного управления и регулирования виртуальных активов. Он обладает обширным опытом работы в государственных органах, международных организациях и бизнес-секторе.
      - strong [ref=e27]: "Краткая биография:"
      - text: Магистр государственного управления (KDI School of Public Policy and Management, Республика Корея).
      - text: Магистр юриспруденции (КНУ им. Ж. Баласагына).
      - text: Работал в Аппарате Президента КР, Министерстве транспорта и коммуникаций, ведущих юридических компаниях и международных проектах.
      - text: Эксперт в области цифровизации правосудия, регулирования криптовалют и защиты персональных данных.
      - text: Благодаря его профессионализму и глубокому пониманию правовых аспектов цифровой экономики, АУРВА продолжит развитие прозрачного и безопасного криптовалютного рынка в Кыргызстане.
