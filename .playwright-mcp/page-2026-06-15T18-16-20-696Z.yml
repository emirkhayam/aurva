    - generic [ref=e107]:
      - text: Представители АУРВА приняли участие в международной программе Open World (США)
      - text: Двое представителей Ассоциации - Председатель Темир Казыбай и Заместитель председателя Акмарал Тулегенова, были номинированы Посольством Соединенных Штатов Америки для участия в международной программе Open World Program.
      - text: Программа проходила в течение 12 дней и включала визиты в г. Вашингтон (округ Колумбия) и г. Гейнсвилл (штат Флорида).
      - text: Open World - это инициатива, финансируемая Конгрессом США и реализуемая при поддержке U.S. Department of State и Congressional Office for International Leadership. Программа направлена на развитие профессионального обмена между лидерами стран Евразии и их американскими коллегами, укрепление взаимопонимания и развитие международного сотрудничества.
      - text: "В рамках программы участники:"
      - text: "-провели встречи с представителями государственных органов, экспертного и делового сообщества США"
      - text: "-обсудили ключевые вызовы и подходы к их решению"
      - text: "-обменялись профессиональным опытом"
      - text: "-установили новые международные контакты"
      - text: Учитывая, что Ассоциация осуществляет свою деятельность сравнительно недавно - около полутора лет, участие в программе стало значимым достижением и важным этапом институционального развития.
      - text: АУРВА выражает искреннюю благодарность Посольству Соединённых Штатов Америки за оказанное доверие и номинацию, а также U.S. Department of State и Congressional Office for International Leadership за предоставленную возможность участия в программе.
